[probe]
; 0 = log only, forward every argument untouched
; 1 = rewrite GetPublishedFileDetails' unMaxSecondsOld to the value below
mode=1

; Value used in mode=1, in seconds. 604800 = 7 days
max_seconds_old=604800

; Dump the first 8 vtable entries at startup (diagnostics)
log_vtable=1

; The harness exercises UGCDownload as well, so the diagnostic hooks must be on
; here even though the shipped ini keeps them off.
diag_hooks=1
